<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vista en vivo - STEAP FRAP</title>
    <meta name="theme-color" content="#000000">
    <meta name="referrer" content="no-referrer">
    <link href="vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/bootstrap-icons.css">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <script src="app-config.js"></script>
    <script src="local-core.js"></script>
    <script src="rastreo.js"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
        .barra { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center; gap: 12px;
            padding: calc(10px + var(--status-bar-height, 24px)) 14px 10px; background: rgba(5, 11, 20, .92); border-bottom: 3px solid #f2dc00; }
        .barra h1 { font-family: var(--titulo); font-weight: 800; font-size: 1.35rem; letter-spacing: .04em; margin: 0; flex: 1; text-transform: uppercase; color: #fff; }
        .barra a, .barra button { color: #fff; background: none; border: 0; padding: 0; font-size: 1.5rem; line-height: 1; }
        .vivo { display: inline-flex; align-items: center; gap: 6px; font: 700 .72rem system-ui, sans-serif; color: #9fb6cf; letter-spacing: .06em; text-transform: uppercase; }
        .vivo i { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34, 197, 94, .7); animation: latido 1.8s infinite; }
        .vivo.error i { background: #f5b301; animation: none; }
        @keyframes latido { 70% { box-shadow: 0 0 0 9px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        @media (prefers-reduced-motion: reduce) { .vivo i { animation: none; } }
        #mapa { position: fixed; inset: 0; z-index: 1; background: #0b1622; }
        #lienzo { position: absolute !important; top: 0; left: 0; width: 100%; height: 100%; }
        #avisoMapa { position: fixed; left: 12px; right: 12px; top: calc(70px + var(--status-bar-height, 24px)); z-index: 1001; display: none; background: rgba(245,179,1,.95); color: #1b1300; font-size: .85rem; border-radius: 10px; padding: 8px 12px; }
        #mapa .leaflet-top { top: calc(62px + var(--status-bar-height, 24px)); }
        #mapa .leaflet-bottom { bottom: calc(var(--hoja, 0px) + 4px); }
        #mapa .gm-style .gmnoprint, #mapa .gm-style-mtc { margin-top: calc(62px + var(--status-bar-height, 24px)) !important; }
        .hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; max-height: 46vh; overflow-y: auto; background: rgba(9, 19, 31, .96);
            border-top: 1px solid rgba(80, 160, 230, .3); border-radius: 18px 18px 0 0; padding: 10px 14px calc(14px + var(--nav-bar-height, 0px)); }
        .hoja .asa { width: 42px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); margin: 0 auto 10px; }
        .hoja h2 { font-family: var(--titulo); font-size: 1.05rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #9fb6cf; margin: 0 0 8px; }
        .unidad { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #0e1c2e; border: 1px solid rgba(80, 160, 230, .2); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; color: #f3f7fc; }
        .unidad.sel { border-color: #f2dc00; }
        .unidad .num { font-family: var(--titulo); font-weight: 800; font-size: 1.6rem; min-width: 56px; text-align: center; color: #0b1d33; background: #f2dc00; border-radius: 10px; padding: 2px 6px; }
        .unidad .det { flex: 1; min-width: 0; }
        .unidad .det b { display: block; font-size: .95rem; }
        .unidad .det span { color: #9fb6cf; font-size: .8rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .estado { font: 700 .7rem system-ui, sans-serif; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
        .estado.en_ruta { background: rgba(34, 197, 94, .18); color: #86efac; }
        .estado.esperando { background: rgba(26, 111, 181, .25); color: #a9cdf0; }
        .estado.sin_senal { background: rgba(245, 179, 1, .18); color: #fcd34d; }
        .vacio { color: #9fb6cf; text-align: center; padding: 14px 4px; font-size: .92rem; }
        .marca { background: #f2dc00; color: #0b1d33; font: 800 13px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: .03em; padding: 5px 8px; border-radius: 10px; border: 2px solid #0b1d33; box-shadow: 0 2px 8px rgba(0,0,0,.5); white-space: nowrap; position: absolute; left: 8px; top: -8px; transform: translate(-50%, -100%); }
        .marca::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: #0b1d33; }
        .marca.sin_senal { background: #8a9bb0; }
        .punto { width: 16px; height: 16px; border-radius: 50%; background: #1a6fb5; border: 3px solid #fff; box-shadow: 0 0 0 3px rgba(26,111,181,.35); }
        .acceso { position: fixed; inset: 0; z-index: 1100; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.75); }
        .acceso.ver { display: flex; }
        .acceso .caja { width: 100%; max-width: 380px; background: #0e1c2e; border: 1px solid #1a6fb5; border-radius: 18px; padding: 20px; }
        .acceso h3 { font-family: var(--titulo); font-weight: 800; text-transform: uppercase; font-size: 1.4rem; margin-bottom: 6px; }
    </style>
</head>
<body>
<div class="barra">
    <a href="dashboard.html" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
    <h1>Vista en vivo</h1>
    <span class="vivo" id="indicador"><i></i><span id="txtIndicador">Conectando</span></span>
    <button type="button" id="btnCentrar" aria-label="Ver todas las unidades"><i class="bi bi-fullscreen"></i></button>
    <button type="button" id="btnMapaCfg" aria-label="Configurar mapa"><i class="bi bi-map"></i></button>
</div>
<div id="mapa" role="application" aria-label="Mapa de unidades"><div id="lienzo"></div></div>
<div id="avisoMapa" role="status"></div>
<div class="hoja">
    <div class="asa"></div>
    <h2 id="tituloLista">Unidades en servicio</h2>
    <div id="lista"><div class="vacio">Cargando…</div></div>
</div>

<div class="acceso" id="acceso">
    <form class="caja" id="formAcceso">
        <h3>Acceso al rastreo</h3>
        <p class="small text-muted mb-3">Escribe la contraseña del panel de rastreo (la misma con la que entras a panel.html). Se guarda solo en este teléfono.</p>
        <label class="form-label small fw-bold" for="aUrl">Dirección del rastreo</label>
        <input type="url" class="form-control mb-2" id="aUrl" placeholder="https://steap.services80.xyz/rastreo" required>
        <label class="form-label small fw-bold" for="aClave">Contraseña del panel</label>
        <input type="password" class="form-control mb-2" id="aClave" autocomplete="current-password" required>
        <div class="alert alert-danger small py-2" id="aError" style="display:none"></div>
        <button class="btn btn-warning fw-bold w-100" type="submit">Ver unidades</button>
        <a href="dashboard.html" class="btn btn-link text-muted w-100 mt-1">Cancelar</a>
    </form>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
(function () {
    const { Perfil, esc } = LocalApp;
    const $ = (id) => document.getElementById(id);
    const p = Perfil.get();
    if (!p || !Perfil.sesionActiva()) { location.replace('login.html'); return; }
    if (!p.admin) { location.replace('dashboard.html'); return; }

    const K = 'vivo_acceso';
    const leer = () => { try { return JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) { return null; } };
    const urlDefecto = () => { const c = window.Rastreo && Rastreo.cfg && Rastreo.cfg(); return (c && c.url) || 'https://steap.services80.xyz/rastreo'; };
    let acceso = leer();
    const TXT = { esperando: 'Esperando señal', en_ruta: 'En servicio', sin_senal: 'Sin señal' };

    // ------------------------------------------------ mapa
    // Dos motores con la misma interfaz: Google Maps (si hay clave) u OpenStreetMap (Leaflet).
    const CENTRO = [15.77, -96.13];
    const padAbajo = () => (document.querySelector('.hoja').offsetHeight || 0) + 30;
    function nuevoLienzo() {
        // Lienzo limpio (si Google falló, deja estilos en el anterior)
        const viejo = document.getElementById('lienzo'); const d = document.createElement('div'); d.id = 'lienzo';
        if (viejo) viejo.replaceWith(d); else document.getElementById('mapa').appendChild(d);
        return d;
    }
    function avisoMapa(t) { const a = document.getElementById('avisoMapa'); a.textContent = t; a.style.display = 'block'; clearTimeout(avisoMapa.t); avisoMapa.t = setTimeout(() => a.style.display = 'none', 30000); }
    function claveMapTiler() { try { return localStorage.getItem('maptiler_key') || ''; } catch (e) { return ''; } }
    function motorLeaflet() {
        const m = L.map(nuevoLienzo(), { zoomControl: false, attributionControl: true }).setView(CENTRO, 12);
        const mt = claveMapTiler();
        if (mt) {
            // MapTiler: calles (estilo tipo Google) y satélite con nombres
            const atr = '<a href="https://www.maptiler.com/copyright/" target="_blank">© MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap</a>';
            const calles = L.tileLayer('https://api.maptiler.com/maps/streets-v2/256/{z}/{x}/{y}.png?key=' + encodeURIComponent(mt), { maxZoom: 20, attribution: atr, referrerPolicy: 'no-referrer', crossOrigin: false });
            const sat = L.tileLayer('https://api.maptiler.com/maps/hybrid/256/{z}/{x}/{y}.jpg?key=' + encodeURIComponent(mt), { maxZoom: 20, attribution: atr, referrerPolicy: 'no-referrer', crossOrigin: false });
            calles.addTo(m);
            L.control.layers({ 'Mapa': calles, 'Satélite': sat }, null, { position: 'topleft', collapsed: false }).addTo(m);
            let avisado = false;
            calles.on('tileerror', () => { if (!avisado) { avisado = true; avisoMapa('MapTiler no respondió (revisa la clave o el límite mensual). Toca el icono del mapa para cambiarla.'); } });
        } else {
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
        }
        L.control.zoom({ position: 'topright' }).addTo(m);
        const c = {};
        return {
            nombre: 'osm',
            unidad(t, ll, html, clic) {
                const ic = L.divIcon({ className: '', html: html, iconSize: [16, 16], iconAnchor: [8, 8] });
                c[t] = c[t] || {};
                if (!c[t].p) { c[t].p = L.marker(ll, { icon: ic }).addTo(m); c[t].p.on('click', clic); }
                else { c[t].p.setLatLng(ll); c[t].p.setIcon(ic); }
            },
            ruta(t, pts) { c[t] = c[t] || {}; if (!c[t].l) c[t].l = L.polyline(pts, { color: '#1a6fb5', weight: 5, opacity: .85 }).addTo(m); else c[t].l.setLatLngs(pts); },
            quitar(t) { if (!c[t]) return; if (c[t].l) m.removeLayer(c[t].l); if (c[t].p) m.removeLayer(c[t].p); delete c[t]; },
            tokens() { return Object.keys(c); },
            pos(t) { const p = c[t] && c[t].p; if (!p) return null; const q = p.getLatLng(); return [q.lat, q.lng]; },
            ver(ll, z) { m.setView(ll, Math.max(m.getZoom(), z), { animate: true }); },
            ajustar(pts) {
                if (pts.length === 1) m.setView(pts[0], 15);
                else if (pts.length > 1) m.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [50, 110], paddingBottomRight: [50, padAbajo()] });
            }
        };
    }
    function motorGoogle() {
        const g = google.maps;
        const m = new g.Map(document.getElementById('lienzo'), {
            center: { lat: CENTRO[0], lng: CENTRO[1] }, zoom: 12, clickableIcons: false, streetViewControl: false, fullscreenControl: false,
            mapTypeControl: true, mapTypeControlOptions: { position: g.ControlPosition.LEFT_TOP, mapTypeIds: ['roadmap', 'hybrid'] },
            zoomControl: true, zoomControlOptions: { position: g.ControlPosition.RIGHT_TOP }, gestureHandling: 'greedy'
        });
        // Marca HTML propia (la misma etiqueta amarilla) sobre el mapa de Google
        class Marca extends g.OverlayView {
            constructor(ll, html, clic) { super(); this.ll = new g.LatLng(ll[0], ll[1]); this.div = document.createElement('div'); this.div.style.cssText = 'position:absolute;width:16px;height:16px;cursor:pointer'; this.div.innerHTML = html; this.div.addEventListener('click', clic); this.setMap(m); }
            onAdd() { this.getPanes().overlayMouseTarget.appendChild(this.div); }
            draw() { const p = this.getProjection().fromLatLngToDivPixel(this.ll); if (p) { this.div.style.left = (p.x - 8) + 'px'; this.div.style.top = (p.y - 8) + 'px'; } }
            onRemove() { this.div.remove(); }
            mover(ll, html) { this.ll = new g.LatLng(ll[0], ll[1]); this.div.innerHTML = html; this.draw(); }
        }
        const c = {};
        return {
            nombre: 'google',
            unidad(t, ll, html, clic) { c[t] = c[t] || {}; if (!c[t].p) c[t].p = new Marca(ll, html, clic); else c[t].p.mover(ll, html); },
            ruta(t, pts) {
                c[t] = c[t] || {}; const path = pts.map(x => ({ lat: x[0], lng: x[1] }));
                if (!c[t].l) c[t].l = new g.Polyline({ path, strokeColor: '#1a6fb5', strokeWeight: 5, strokeOpacity: .9, map: m }); else c[t].l.setPath(path);
            },
            quitar(t) { if (!c[t]) return; if (c[t].l) c[t].l.setMap(null); if (c[t].p) c[t].p.setMap(null); delete c[t]; },
            tokens() { return Object.keys(c); },
            pos(t) { const p = c[t] && c[t].p; return p ? [p.ll.lat(), p.ll.lng()] : null; },
            ver(ll, z) { m.panTo({ lat: ll[0], lng: ll[1] }); if (m.getZoom() < z) m.setZoom(z); },
            ajustar(pts) {
                if (pts.length === 1) { m.setCenter({ lat: pts[0][0], lng: pts[0][1] }); m.setZoom(15); }
                else if (pts.length > 1) { const b = new g.LatLngBounds(); pts.forEach(x => b.extend({ lat: x[0], lng: x[1] })); m.fitBounds(b, { top: 110, left: 50, right: 50, bottom: padAbajo() }); }
            }
        };
    }
    // Google escribe el motivo exacto en la consola (p. ej. BillingNotEnabledMapError); lo mostramos en pantalla.
    const MOTIVOS = {
        BillingNotEnabledMapError: 'La facturación no está activa en el proyecto de la clave (vincula My First Project a la cuenta de facturación nueva).',
        ApiNotActivatedMapError: 'Falta habilitar "Maps JavaScript API" en el proyecto de la clave.',
        RefererNotAllowedMapError: 'La restricción de "Sitios web" de la clave no permite la app: agrega https://localhost/* (o quítala para probar).',
        ApiTargetBlockedMapError: 'La clave tiene restricción de API que no incluye "Maps JavaScript API".',
        InvalidKeyMapError: 'La clave no es válida (revisa que esté copiada completa).',
        ExpiredKeyMapError: 'La clave expiró o fue borrada.',
        DeletedApiProjectMapError: 'El proyecto de la clave fue borrado.',
        MissingKeyMapError: 'No se envió la clave.'
    };
    (function () {
        const orig = console.error.bind(console), orig2 = console.warn.bind(console);
        const revisar = (args) => { const t = args.map(String).join(' '); const m = /([A-Za-z]+MapError)/.exec(t); if (m) avisoMapa('Google Maps: ' + m[1] + '. ' + (MOTIVOS[m[1]] || '')); };
        console.error = function () { revisar([].slice.call(arguments)); orig.apply(null, arguments); };
        console.warn = function () { revisar([].slice.call(arguments)); orig2.apply(null, arguments); };
    })();
    function claveGoogle() {
        let k = ''; try { k = localStorage.getItem('google_maps_key') || ''; } catch (e) {}
        return k || (window.APP_INSTITUCION && window.APP_INSTITUCION.googleMapsKey) || window.GOOGLE_MAPS_KEY || '';
    }
    let mapa = null;
    function iniciarMapa() {
        const k = claveGoogle();
        if (!k) { mapa = motorLeaflet(); return Promise.resolve(); }
        return new Promise((ok) => {
            let listo = false;
            const usarOsm = (motivo) => { if (listo) return; listo = true; console.warn('Google Maps no disponible:', motivo); avisoMapa('Mapa de Google no disponible (' + motivo + '). Se muestra el mapa libre.'); mapa = motorLeaflet(); ok(); };
            window.gm_authFailure = () => { listo = false; mapa = null; primerAjuste = true; usarOsm('Google rechazó la clave: revisa en Google Cloud que esté habilitada Maps JavaScript API, que la facturación esté activa y que en Sitios web esté https://localhost/*'); if (ultimo) pintar(ultimo); };
            window.__gmListo = () => { if (listo) return; listo = true; try { mapa = motorGoogle(); } catch (e) { listo = false; usarOsm(e.message); return; } ok(); };
            const sc = document.createElement('script');
            sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(k) + '&callback=__gmListo&language=es&region=MX&loading=async&v=weekly';
            sc.async = true; sc.onerror = () => usarOsm('sin conexión');
            document.head.appendChild(sc);
            setTimeout(() => usarOsm('tiempo agotado'), 12000);
        });
    }
    let seleccion = null, primerAjuste = true, ultimo = null, timer = null;

    function hace(seg) {
        if (seg == null) return 'sin ubicación aún';
        if (seg < 60) return 'hace ' + seg + ' s';
        if (seg < 3600) return 'hace ' + Math.floor(seg / 60) + ' min';
        return 'hace ' + Math.floor(seg / 3600) + ' h';
    }
    function ajustarTodo() { if (mapa) mapa.ajustar(mapa.tokens().map(t => mapa.pos(t)).filter(Boolean)); }

    function pintar(d) {
        ultimo = d;
        const act = d.activos || [];
        const vistos = {};
        if (mapa) {
            act.forEach(s => {
                vistos[s.token] = true;
                const ruta = ((d.rutas || {})[s.token] || []).map(x => [x[0], x[1]]);
                if (ruta.length > 1) mapa.ruta(s.token, ruta);
                if (s.lat != null && s.lng != null) {
                    mapa.unidad(s.token, [s.lat, s.lng], '<div class="punto"></div><div class="marca ' + s.estado + '">' + esc(s.unidad || 'Unidad') + '</div>', () => enfocar(s.token));
                }
            });
            mapa.tokens().forEach(t => { if (!vistos[t]) mapa.quitar(t); });
        }
        $('tituloLista').textContent = act.length ? 'Unidades en servicio (' + act.length + ')' : 'Unidades en servicio';
        $('lista').innerHTML = act.length ? act.map(s => {
            const seg = s.ult ? Math.max(0, d.ahora - s.ult) : null;
            const vel = s.vel != null && s.vel > 0.5 ? ' · ' + Math.round(s.vel * 3.6) + ' km/h' : '';
            return '<button type="button" class="unidad' + (seleccion === s.token ? ' sel' : '') + '" data-t="' + esc(s.token) + '">' +
                '<span class="num">' + esc(s.unidad || '—') + '</span>' +
                '<span class="det"><b>' + esc(s.tipo || 'Servicio') + '</b><span>' + esc(s.folio || '') + '</span><span>' + hace(seg) + vel + '</span></span>' +
                '<span class="estado ' + s.estado + '">' + (TXT[s.estado] || s.estado) + '</span></button>' +
                (seleccion === s.token ? '<button type="button" class="btn btn-outline-danger btn-sm w-100 mb-2" data-fin="' + esc(s.token) + '" data-un="' + esc(s.unidad || '') + '"><i class="bi bi-flag-fill"></i> Finalizar servicio de ' + esc(s.unidad || 'esta unidad') + '</button>' : '');
        }).join('') : '<div class="vacio"><i class="bi bi-check2-circle"></i> Ninguna unidad en servicio por ahora.<br><small>Aparecen aquí en cuanto registran una salida a servicio.</small></div>';
        document.documentElement.style.setProperty('--hoja', document.querySelector('.hoja').offsetHeight + 'px');
        if (mapa && primerAjuste && mapa.tokens().some(t => mapa.pos(t))) { ajustarTodo(); primerAjuste = false; }
    }
    function enfocar(t) {
        seleccion = t;
        const ll = mapa && mapa.pos(t);
        if (ll) mapa.ver(ll, 16);
        if (ultimo) pintar(ultimo);
    }
    $('lista').addEventListener('click', async (e) => {
        const f = e.target.closest('[data-fin]');
        if (f) {
            if (!confirm('¿Finalizar el servicio de ' + (f.dataset.un || 'esta unidad') + '? Úsalo cuando la unidad ya regresó pero su teléfono no pudo cerrar el servicio.')) return;
            f.disabled = true;
            try {
                const r = await fetch(acceso.url + '/api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: 'finalizar', t: f.dataset.fin, clave_panel: acceso.clave }) });
                const d = await r.json();
                if (!d.ok) throw new Error(d.error || 'No se pudo finalizar.');
                seleccion = null; consultar();
            } catch (err) {
                alert(/acci[oó]n no reconocida/i.test(err.message) ? 'Primero reemplaza el api.php de la carpeta rastreo en tu hosting.' : err.message);
                f.disabled = false;
            }
            return;
        }
        const b = e.target.closest('[data-t]'); if (b) enfocar(b.dataset.t);
    });
    $('btnCentrar').addEventListener('click', () => { seleccion = null; ajustarTodo(); if (ultimo) pintar(ultimo); });

    // ------------------------------------------------ datos
    function indicador(ok, txt) { $('indicador').classList.toggle('error', !ok); $('txtIndicador').textContent = txt; }
    async function consultar() {
        if (!acceso) return;
        const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 15000);
        try {
            const r = await fetch(acceso.url + '/api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accion: 'activos', clave_panel: acceso.clave }), signal: ctrl.signal });
            const d = await r.json();
            if (r.status === 401) { pedirAcceso('La contraseña del panel ya no es válida.'); return; }
            if (!d.ok) throw new Error(d.error || 'Error');
            pintar(d); indicador(true, 'En vivo');
        } catch (e) {
            indicador(false, navigator.onLine === false ? 'Sin internet' : 'Reintentando');
        } finally { clearTimeout(tm); }
    }
    function arrancar() { clearInterval(timer); consultar(); timer = setInterval(() => { if (!document.hidden) consultar(); }, 8000); }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) consultar(); });

    function pedirAcceso(msg) {
        clearInterval(timer);
        $('aUrl').value = (acceso && acceso.url) || urlDefecto();
        $('aClave').value = '';
        $('aError').style.display = msg ? 'block' : 'none'; $('aError').textContent = msg || '';
        $('acceso').classList.add('ver');
        setTimeout(() => $('aClave').focus(), 60);
    }
    $('formAcceso').addEventListener('submit', async (e) => {
        e.preventDefault();
        let url = $('aUrl').value.trim().replace(/\/+$/, '').replace(/\/(api\.php|panel\.html|ver\.html|index\.html)$/i, '');
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        const clave = $('aClave').value.trim();
        try {
            const r = await fetch(url + '/api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: 'activos', clave_panel: clave }) });
            const d = await r.json();
            if (!d.ok) {
                if (/sesi[oó]n no iniciada/i.test(d.error || '')) throw new Error('El servidor de rastreo todavía tiene la versión anterior. Reemplaza el archivo api.php dentro de la carpeta rastreo de tu hosting y vuelve a intentar.');
                throw new Error(r.status === 401 ? 'Contraseña incorrecta. Escríbela igual que en panel.html (respeta mayúsculas).' : (d.error || 'No se pudo entrar.'));
            }
            acceso = { url, clave }; localStorage.setItem(K, JSON.stringify(acceso));
            $('acceso').classList.remove('ver');
            pintar(d); indicador(true, 'En vivo'); arrancar();
        } catch (err) {
            $('aError').style.display = 'block';
            $('aError').textContent = err.name === 'TypeError' ? 'No hay conexión con esa dirección. Revisa la dirección y tu internet.' : err.message;
        }
    });

    $('btnMapaCfg').addEventListener('click', () => {
        const actual = claveGoogle();
        const v = prompt('Clave del mapa: pega tu clave de MapTiler o de Google Maps (empieza con AIza).\nDéjala vacía para usar el mapa libre (OpenStreetMap).', claveMapTiler() || actual);
        if (v === null) return;
        try {
            const c = v.trim();
            localStorage.setItem('google_maps_key_manual', '1');
            localStorage.removeItem('google_maps_key'); localStorage.removeItem('maptiler_key');
            if (/^AIza/.test(c)) localStorage.setItem('google_maps_key', c);
            else if (c) localStorage.setItem('maptiler_key', c);
        } catch (e) {}
        location.reload();
    });
    iniciarMapa().then(() => { if (ultimo) pintar(ultimo); });
    if (acceso) arrancar(); else pedirAcceso('');
})();
</script>
</body>
</html>
