<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STEAP FRAP">
<link rel="apple-touch-icon" href="icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Acceso - STEAP FRAP</title>
    <meta name="theme-color" content="#000000">
    <link href="vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding-top: var(--status-bar-height, 24px); box-sizing: border-box; }
        .login-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .logo-cruz { color: #cc0000; font-size: 3rem; margin-bottom: 10px; }
        .btn-cruz { background-color: #cc0000; color: white; border: none; border-radius: 10px; font-weight: bold; padding: 12px; }
        .btn-cruz:hover { background-color: #990000; color: white; }
        .form-control { border-radius: 10px; padding: 12px; }
    </style>
    <script src="app-config.js"></script>
    <script src="local-core.js"></script>
    <script src="rastreo.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="container px-3">
    <div class="login-card mx-auto text-center">
        <img src="steap-logo.png" alt="STEAP Paramédicos" style="width:min(78%,300px);height:auto;margin:0 auto 12px;display:block;">
        <h3 class="fw-bold text-dark mb-1">FRAP Digital</h3>
        <p class="text-muted small mb-4">Registro de atención prehospitalaria · STEAP</p>

        <div id="cajaError" class="alert alert-danger shadow-sm border-0" role="alert" style="display:none;">
            <i class="bi bi-exclamation-triangle-fill"></i> <span id="txtError"></span>
        </div>

        <!-- Sesión guardada en este teléfono -->
        <div id="bloqueContinuar" style="display:none;">
            <p class="text-muted mb-1">Sesión guardada en este teléfono</p>
            <h5 class="fw-bold mb-1" id="txtPerfilGuardado"></h5>
            <p class="small text-muted mb-3" id="txtUsuarioGuardado"></p>
            <button type="button" id="btnContinuar" class="btn btn-cruz w-100 shadow-sm">Continuar</button>
            <button type="button" id="btnOtroPerfil" class="btn btn-link text-muted mt-3 small">Entrar con otro usuario</button>
        </div>
        <!-- Inicio de sesión -->
        <form id="formLogin" style="display:none;" autocomplete="on">
            <p class="text-muted small text-start" id="txtAvisoLogin">Entra con el usuario y la contraseña que te dio el administrador. La primera vez necesitas internet; después la app funciona sin señal.</p>
            <div class="mb-3 text-start">
                <label class="form-label text-muted fw-bold small" for="usuario">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-fill text-muted"></i></span>
                    <input type="text" id="usuario" class="form-control border-start-0 bg-light" placeholder="Ej. jperez01" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                </div>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-muted fw-bold small" for="clave">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                    <input type="password" id="clave" class="form-control border-start-0 border-end-0 bg-light" autocomplete="current-password" required>
                    <button type="button" class="input-group-text bg-light" id="btnVerClave" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <button type="submit" id="btnEntrar" class="btn btn-cruz w-100 shadow-sm">Entrar</button>
        </form>
    </div>
</div>
<script>
    const { Perfil, TG, Nube } = LocalApp;
    const $ = (id) => document.getElementById(id);
    function error(msg) { $('txtError').textContent = msg; $('cajaError').style.display = msg ? 'block' : 'none'; }
    function irAInicio() {
        Perfil.iniciarSesion();
        const destino = Perfil.pantallaInicio();
        localStorage.setItem('home_screen', destino);
        // La primera vez, si Telegram no está vinculado, se pasa por Ajustes.
        window.location.href = TG.configurado() ? destino : 'ajustes.html?primera=1';
    }
    function mostrarLogin() {
        $('bloqueContinuar').style.display = 'none';
        $('formLogin').style.display = 'block';
        setTimeout(() => $('usuario').focus(), 50);
    }
    const perfil = Perfil.get();
    if (localStorage.getItem('sesion_revocada')) {
        error('Tu acceso cambió (te dieron de baja o te asignaron otra contraseña). Entra de nuevo con los datos que te dé el administrador.');
    }
    if (perfil && perfil.token) {
        $('txtPerfilGuardado').textContent = perfil.nombre;
        $('txtUsuarioGuardado').textContent = 'Usuario: ' + (perfil.usuario || '') + (perfil.admin ? ' · Administrador' : '');
        $('bloqueContinuar').style.display = 'block';
        $('btnContinuar').addEventListener('click', irAInicio);
        $('btnOtroPerfil').addEventListener('click', () => {
            if (!confirm('¿Cerrar la sesión de ' + perfil.nombre + ' en este teléfono? Sus registros se quedan guardados aquí.')) return;
            Nube.llamar('cerrar_sesion').catch(() => {});
            const p = Perfil.get(); delete p.token; p.admin = false; localStorage.setItem('perfil', JSON.stringify(p));
            Perfil.cerrarSesion();
            mostrarLogin();
        });
    } else {
        if (perfil && !localStorage.getItem('sesion_revocada')) $('txtAvisoLogin').textContent = 'Ahora cada persona entra con su usuario y contraseña. Pídeselos al administrador. Tus registros guardados en este teléfono no se borran.';
        mostrarLogin();
    }
    $('btnVerClave').addEventListener('click', () => {
        const c = $('clave'); c.type = c.type === 'password' ? 'text' : 'password';
        $('btnVerClave').innerHTML = c.type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });
    $('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        error('');
        const usuario = $('usuario').value.trim(), clave = $('clave').value;
        if (!usuario || !clave) { error('Escribe tu usuario y tu contraseña.'); return; }
        if (navigator.onLine === false) { error('Necesitas internet para entrar la primera vez. Conéctate e inténtalo de nuevo.'); return; }
        const b = $('btnEntrar'); b.disabled = true; b.textContent = 'Entrando...';
        try {
            await Nube.login(usuario, clave);
            Nube.sincronizar();
            irAInicio();
        } catch (err) {
            error(err.red ? 'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.' : err.message);
            b.disabled = false; b.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
