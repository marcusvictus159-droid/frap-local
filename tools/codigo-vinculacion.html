<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Código de vinculación — FRAP Digital</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; padding: 16px; color: #222; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 1.25rem; color: #cc0000; }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 3px 10px rgba(0,0,0,.06); margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: .85rem; margin: 10px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  button { background: #cc0000; color: #fff; border: 0; border-radius: 10px; padding: 12px; width: 100%; font-weight: 700; font-size: 1rem; margin-top: 12px; }
  button.sec { background: #fff; color: #333; border: 1px solid #bbb; }
  .aviso { background: #fff3cd; border-radius: 10px; padding: 10px; font-size: .85rem; }
  .error { background: #f8d7da; border-radius: 10px; padding: 10px; font-size: .9rem; display: none; margin-top: 10px; }
  #qr { display: block; margin: 12px auto; image-rendering: pixelated; max-width: 100%; }
  code { word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Código de vinculación de Telegram</h1>
  <div class="aviso">🔒 Esta página funciona <b>sin internet</b>: el token no sale de tu dispositivo. El código y el QR que genera dan acceso al bot, así que compártelos solo con el personal autorizado (mejor en persona, escaneando el QR).</div>

  <div class="card">
    <label for="token">Token del bot (lo da @BotFather)</label>
    <input id="token" autocomplete="off" placeholder="123456789:AAE...">
    <label for="chat">ID del grupo (empieza con -100…)</label>
    <input id="chat" autocomplete="off" placeholder="-1001234567890">
    <label for="grupo">Nombre del grupo (opcional, solo para mostrarlo)</label>
    <input id="grupo" autocomplete="off" placeholder="Nombre del grupo">
    <button id="btnGenerar" type="button">Generar código y QR</button>
    <div id="error" class="error"></div>
  </div>

  <div class="card" id="resultado" style="display:none;">
    <canvas id="qr"></canvas>
    <p style="text-align:center;font-size:.85rem;color:#666;margin:0 0 8px;">En la app: Ajustes → Telegram → Escanear QR</p>
    <label for="codigo">Código de texto</label>
    <textarea id="codigo" rows="5" readonly></textarea>
    <button id="btnCopiar" type="button" class="sec">Copiar código</button>
    <button id="btnPng" type="button" class="sec">Guardar QR como imagen</button>
  </div>
</main>
<script src="qrgen.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  function mostrarError(t) { const e = $('error'); e.textContent = t; e.style.display = t ? 'block' : 'none'; }
  function dibujar(modulos, n) {
    const escala = 8, borde = 4, c = $('qr'), lado = (n + borde * 2) * escala;
    c.width = lado; c.height = lado;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, lado, lado); x.fillStyle = '#000';
    for (let y = 0; y < n; y++) for (let i = 0; i < n; i++) if (modulos[y][i]) x.fillRect((i + borde) * escala, (y + borde) * escala, escala, escala);
  }
  $('btnGenerar').addEventListener('click', () => {
    mostrarError('');
    const token = $('token').value.trim(), chat = $('chat').value.trim(), grupo = $('grupo').value.trim();
    if (!/^\d{6,}:[A-Za-z0-9_-]{30,}$/.test(token)) return mostrarError('El token no parece válido (debe verse como 123456789:AAE…).');
    if (!/^-?\d+$/.test(chat) && !/^@\w+$/.test(chat)) return mostrarError('El ID del grupo debe ser un número como -1001234567890 (o @canal).');
    // Mismo formato que LocalApp.TG.codificarCodigo en la app.
    const codigo = 'FRAP1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ t: token, c: chat, g: grupo }))));
    $('codigo').value = codigo;
    try { const r = QRGen.crear(codigo, 'M'); dibujar(r.modulos, r.tamano); }
    catch (e) { return mostrarError('No se pudo hacer el QR: ' + e.message); }
    $('resultado').style.display = 'block';
  });
  $('btnCopiar').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('codigo').value); $('btnCopiar').textContent = 'Copiado ✓'; }
    catch (e) { $('codigo').select(); document.execCommand('copy'); $('btnCopiar').textContent = 'Copiado ✓'; }
    setTimeout(() => { $('btnCopiar').textContent = 'Copiar código'; }, 2000);
  });
  $('btnPng').addEventListener('click', () => {
    const a = document.createElement('a'); a.href = $('qr').toDataURL('image/png'); a.download = 'qr-vinculacion-frap.png'; a.click();
  });
</script>
</body>
</html>
